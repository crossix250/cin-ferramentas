<style>
  :root{
    --navy:#1b2a5e; --navy-soft:#2f3f78; --red:#d4202a;
    --ink:#1c2230; --muted:#5a6480; --line:rgba(27,42,94,.14);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78);
    --ok:#1f9d6b; --warn:#c8881a; --info:#2f6fd4; --done:#6b7280;
    --radius:18px; --shadow:0 10px 40px rgba(27,42,94,.12);
    --risk-low:var(--ok); --risk-mid:var(--warn); --risk-high:var(--red);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Poppins",system-ui,Arial,sans-serif;
    color:var(--ink);
    min-height:100%;
    background:
      radial-gradient(1100px 700px at 12% -5%, #dfe7ff 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 0%, #ffe2e4 0%, transparent 50%),
      radial-gradient(800px 800px at 50% 120%, #e4ecff 0%, transparent 55%),
      linear-gradient(135deg,#eef2fb 0%,#f6f8fd 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font-family:inherit;}
  button{cursor:pointer;}

  .shell{display:flex;flex-direction:column;min-height:100vh;}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    margin:14px 14px 0;padding:12px 16px;position:sticky;top:14px;z-index:20;
  }
  .topbar-brand{display:flex;align-items:center;gap:9px;}
  .brand-logo-img{height:28px;width:auto;display:block;}
  .sidebar-brand{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .sidebar-title{font-size:13px;font-weight:700;margin-top:1px;color:var(--navy);}
  .topbar-spacer{flex:1;}
  .client-select{
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;
    color:var(--navy);background:#fff;min-width:220px;max-width:340px;
  }
  .client-select:focus{outline:none;border-color:var(--red);}

  /* Main */
  .main{flex:1;padding:20px 40px 60px;max-width:1320px;margin:0 auto;width:100%;}
  .btn-primary{background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600;font-size:13.5px;box-shadow:0 6px 16px rgba(212,32,42,.28);}
  .btn-primary:hover{background:#b81c25;}
  .btn-secondary{background:var(--glass);color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;}
  .btn-secondary:hover{background:#fff;}
  .btn-ghost{background:transparent;border:none;color:var(--muted);font-size:12.5px;padding:5px 6px;}
  .btn-ghost:hover{color:var(--red);}

  .client-header{
    margin-bottom:22px;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;
  }
  .client-name-input{font-size:24px;font-weight:700;border:none;background:transparent;color:var(--navy);padding:2px 0;width:100%;}
  .client-name-input:focus{outline:none;border-bottom:2px solid var(--red);}
  .client-meta{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap;}
  .client-meta-field{display:flex;flex-direction:column;gap:3px;}
  .client-meta-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  .client-meta-field input{border:none;border-bottom:1px solid var(--line);background:transparent;font-size:13px;padding:3px 0;min-width:150px;color:var(--ink);}
  .client-meta-field input:focus{outline:none;border-bottom-color:var(--red);}

  .section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center;}

  #risk-list{display:grid;grid-template-columns:1fr;gap:12px;}
  .risk-card{
    display:flex;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  }
  .risk-heat{width:7px;flex-shrink:0;}
  .risk-body{flex:1;padding:14px 18px;}
  .risk-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .risk-title-input{font-weight:700;font-size:14.5px;border:none;background:transparent;flex:1;padding:2px 0;color:var(--navy);}
  .risk-title-input:focus{outline:none;border-bottom:1px solid var(--red);}
  .risk-score-wrap{display:flex;flex-direction:row;align-items:center;gap:8px;}
  .risk-score-label{font-weight:800;font-size:15.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);white-space:nowrap;}
  .risk-score{font-weight:800;font-size:17px;padding:3px 10px;border-radius:8px;white-space:nowrap;}
  .risk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 18px;margin-top:10px;}
  .risk-grid-full{grid-column:1/-1;}
  .risk-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;margin-bottom:3px;}
  .char-counter{font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);}
  .risk-field input,.risk-field textarea,.risk-field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;resize:vertical;background:rgba(255,255,255,.6);color:var(--ink);}
  .risk-field select{background:#fff;}
  .risk-field input:focus,.risk-field textarea:focus,.risk-field select:focus{outline:none;border-color:var(--red);background:#fff;}
  .risk-sliders{display:flex;gap:18px;margin-top:2px;}
  .risk-slider{flex:1;}
  .risk-slider-label{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .risk-slider-value{font-weight:800;font-size:12.5px;color:var(--navy);}
  .risk-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);}
  .add-risk-btn{background:var(--glass);border:1.5px dashed var(--line);border-radius:var(--radius);padding:11px;width:100%;color:var(--navy);font-weight:700;font-size:13px;}
  .add-risk-btn:hover{background:#fff;}

  .yearly-table-wrap{
    background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);
  }
  table.yearly-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.yearly-table th,table.yearly-table td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  table.yearly-table th:first-child,table.yearly-table td:first-child{position:sticky;left:0;background:var(--glass-strong);font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;}
  table.yearly-table thead th{font-weight:800;color:var(--navy);background:rgba(27,42,94,.06);}
  .year-header-input{
    width:64px;border:1px solid transparent;background:transparent;color:var(--navy);
    font-weight:800;font-size:13px;padding:4px 5px;border-radius:6px;text-align:left;
  }
  .year-header-input:hover{border-color:var(--line);}
  .year-header-input:focus{outline:none;border-color:var(--red);background:#fff;}
  table.yearly-table input{border:1px solid var(--line);background:#fff;font-size:12px;padding:5px 7px;border-radius:6px;width:120px;color:var(--ink);}
  table.yearly-table input:hover{border-color:var(--line);}
  table.yearly-table input:focus{outline:none;border-color:var(--red);background:#fff;}

  .observacoes-box textarea{
    width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;font-size:13px;
    background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);color:var(--ink);
  }
  .observacoes-box textarea:focus{outline:none;border-color:var(--red);}

  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;}

  /* ---------- PRINT / PDF ---------- */
  #print-sheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    .shell, .topbar{display:none !important;}
    #print-sheet, #print-sheet *{visibility:visible;}
    #print-sheet{display:block !important;position:absolute;top:0;left:0;width:100%;padding:0;}
    @page{margin:14mm;}
  }

  .ps-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px;}
  .ps-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .ps-logo-img{height:26px;width:auto;display:block;}
  .ps-brand{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#000;font-weight:400;}
  .ps-title{font-size:20px;font-weight:800;margin-top:2px;color:#000;}
  .ps-meta{font-size:10.5px;text-align:right;color:#000;font-weight:400;line-height:1.6;}
  .ps-section{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#000;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
  table.ps-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10.5px;margin-bottom:6px;}
  table.ps-table th,table.ps-table td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top;color:#000;font-weight:400;word-wrap:break-word;overflow-wrap:anywhere;}
  table.ps-table th{background:rgba(27,42,94,.07);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em;color:#000;font-weight:400;}
  table.ps-table td.ps-score{font-weight:400;text-align:center;color:#000;}
  .ps-obs{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;color:#000;font-weight:400;min-height:50px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;}
  .ps-footer{margin-top:20px;font-size:9px;color:#000;font-weight:400;text-align:right;}
</style>

let state = load();
normalizeYearlyIds();
let activeId = state.clients[0]?.id || null;

function normalizeYearlyIds(){
  state.clients.forEach(c => {
    (c.yearlyData || []).forEach(y => { if(!y.id) y.id = uid(); });
  });
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { clients: JSON.parse(JSON.stringify(SEED)) };
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(){ return 'id' + Math.random().toString(36).slice(2,10); }
function getClient(id){ return state.clients.find(c => c.id === id); }
function heatColor(score){
  if(score > 45) return '#D4202A';
  if(score > 35) return '#E2711D';
  if(score > 25) return '#C98A2C';
  return '#1F9D6B';
}
function bulletsToText(arr){ return (arr||[]).join('\n'); }
function textToBullets(t){ return t.split('\n').map(l=>l.trim()).filter(Boolean); }
function fmtMoney(v){ return (v===null||v===undefined||v==='') ? '—' : Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function fmtPercent(v){ return (v===null||v===undefined||v==='') ? '—' : Math.round(v*100) + '%'; }

const CONCORRENCIA_BRANDS = ['Arga','Barbot','Blatem','Dankal','Dieira','Dissoltin','Divercol','Douro','Dyrup','Europa','Fassa Bartolo','Hempel','Jafep','Kar','Keim','Kenitex','Kerakoll','Mapei','Marilina','Matesica','Monto','Neuce','PPG','Procolor','Robbialac','Secil','Sika','Tintas 2000','Titan','Topeca','TSL','Viero','Weber','Outras'];
const OWNER_OPTIONS = ['Vendedor/Loja','Chefe de Vendas','Direcção Comercial'];
const MAX_RISKS = 4;

function riskYearOptions(){
  const y = new Date().getFullYear();
  return [y, y+1, y+2, y+3];
}
function furthestRiskYear(){
  const opts = riskYearOptions();
  return String(opts[opts.length - 1]);
}
function formatRiskDate(v){
  if(/^\d{4}$/.test(String(v||'').trim())) return `31/12/${v}`;
  return v || '—';
}
function calcComprasConcorrencia(compras, percCin){
  const total = Number(compras);
  const pct = Number(percCin);
  if(!Number.isFinite(total) || !Number.isFinite(pct)) return null;
  return total - (total * pct);
}

function renderSidebar(){
  const select = document.getElementById('client-select');
  select.innerHTML = '';
  state.clients.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = `${c.nome} · Nº ${c.numero || '—'}`;
    if(c.id === activeId) opt.selected = true;
    select.appendChild(opt);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  const client = getClient(activeId);
  if(!client){ root.innerHTML = '<div class="hint">Sem clientes. Cria o primeiro em <b>+ NOVO CLIENTE</b>.</div>'; return; }

  root.innerHTML = `
    <div class="client-header">
      <input class="client-name-input" id="f-nome" value="${escapeHtml(client.nome)}" />
      <div class="client-meta">
        <div class="client-meta-field"><label>Cliente número</label><input id="f-numero" value="${escapeHtml(client.numero)}"/></div>
        <div class="client-meta-field"><label>Geografia (sede)</label><input id="f-geografia" value="${escapeHtml(client.geografia)}" style="min-width:260px"/></div>
      </div>
    </div>

    <div class="section-title">Matriz de risco</div>
    <div id="risk-list"></div>
    <button class="add-risk-btn" id="add-risk-btn">+ Adicionar risco</button>
    <div class="hint" id="risk-limit-notice" style="display:none">Limite de 4 riscos por cliente atingido.</div>

    <div class="section-title">Compras · Marcas · Lojas · Colaboradores</div>
    <div class="yearly-table-wrap"><table class="yearly-table" id="yearly-table"></table></div>

    <div class="section-title">Observações</div>
    <div class="observacoes-box"><textarea id="f-observacoes" placeholder="Notas ou informação relevante...">${escapeHtml(client.observacoes)}</textarea></div>
  `;

  document.getElementById('f-nome').oninput = e => { client.nome = e.target.value; save(); renderSidebar(); };
  document.getElementById('f-numero').oninput = e => { client.numero = e.target.value; save(); renderSidebar(); };
  document.getElementById('f-geografia').oninput = e => { client.geografia = e.target.value; save(); renderSidebar(); };
  document.getElementById('f-observacoes').oninput = e => { client.observacoes = e.target.value; save(); };
  document.getElementById('add-risk-btn').onclick = () => {
    if(client.risks.length >= MAX_RISKS) return;
    client.risks.push({ id:uid(), titulo:'Novo risco', tipoRisco:'', perigos:'', descricao:'', nivelRisco:3, impactoRisco:3, mitigacao:[], planoContingencia:[], owner:'', data:String(new Date().getFullYear()) });
    save(); renderRiskList(client);
  };

  renderRiskList(client);
  renderYearlyTable(client);
}

function renderRiskList(client){
  const wrap = document.getElementById('risk-list');
  wrap.innerHTML = '';
  const sorted = [...client.risks].sort((a,b) => (b.nivelRisco*b.impactoRisco) - (a.nivelRisco*a.impactoRisco));

  sorted.forEach(risk => {
    const score = (Number(risk.nivelRisco)||0) * (Number(risk.impactoRisco)||0);
    const color = heatColor(score);
    const card = document.createElement('div');
    card.className = 'risk-card';
    card.innerHTML = `
      <div class="risk-heat" style="background:${color}"></div>
      <div class="risk-body">
        <div class="risk-row-top">
          <input class="risk-title-input" value="${escapeHtml(risk.titulo)}" placeholder="Nome do risco" data-field="titulo"/>
          <div class="risk-score-wrap">
            <span class="risk-score-label">Avaliação do Risco</span>
            <span class="risk-score" style="background:${color}22;color:${color}">${score}</span>
          </div>
        </div>
        <div class="risk-grid">
          <div class="risk-field"><label>Tipo de risco <span class="char-counter" data-counter="tipoRisco">${(risk.tipoRisco||'').length}/50</span></label><input maxlength="50" value="${escapeHtml(risk.tipoRisco)}" data-field="tipoRisco"/></div>
          <div class="risk-field"><label>Perigos imediatos <span class="char-counter" data-counter="perigos">${(risk.perigos||'').length}/50</span></label><input maxlength="50" value="${escapeHtml(risk.perigos)}" data-field="perigos"/></div>
          <div class="risk-field risk-grid-full"><label>Descrição <span class="char-counter" data-counter="descricao">${(risk.descricao||'').length}/200</span></label><textarea rows="2" maxlength="200" data-field="descricao">${escapeHtml(risk.descricao)}</textarea></div>
          <div class="risk-grid-full risk-sliders">
            <div class="risk-slider">
              <label class="risk-slider-label">Probabilidade de Risco (1–10) <span class="risk-slider-value" data-role="nrval">${risk.nivelRisco}</span></label>
              <input type="range" min="1" max="10" value="${risk.nivelRisco}" data-field="nivelRisco" style="width:100%"/>
            </div>
            <div class="risk-slider">
              <label class="risk-slider-label">Impacto do risco (1–10) <span class="risk-slider-value" data-role="irval">${risk.impactoRisco}</span></label>
              <input type="range" min="1" max="10" value="${risk.impactoRisco}" data-field="impactoRisco" style="width:100%"/>
            </div>
          </div>
          <div class="risk-field"><label>Mitigação do risco <span class="char-counter" data-counter="mitigacao">${bulletsToText(risk.mitigacao).length}/200</span></label><textarea rows="3" maxlength="200" data-field="mitigacao" placeholder="Uma ideia por linha...">${escapeHtml(bulletsToText(risk.mitigacao))}</textarea></div>
          <div class="risk-field"><label>Plano de contingência <span class="char-counter" data-counter="planoContingencia">${bulletsToText(risk.planoContingencia).length}/200</span></label><textarea rows="3" maxlength="200" data-field="planoContingencia" placeholder="Uma ideia por linha...">${escapeHtml(bulletsToText(risk.planoContingencia))}</textarea></div>
        </div>
        <div class="risk-footer">
          <div style="display:flex;gap:14px">
            <div class="risk-field" style="min-width:170px"><label>Owner</label>
              <select data-field="owner">
                <option value="">— por definir —</option>
                ${OWNER_OPTIONS.map(o => `<option value="${o}" ${risk.owner===o?'selected':''}>${o}</option>`).join('')}
              </select>
            </div>
            <div class="risk-field" style="min-width:190px"><label>Data limite</label>
              <select data-field="data">
                ${riskYearOptions().map(y => `<option value="${y}" ${String(risk.data)===String(y)?'selected':''}>31/12/${y}</option>`).join('')}
              </select>
            </div>
          </div>
          <button class="btn-ghost" data-action="delete">Remover risco</button>
        </div>
      </div>
    `;

    card.querySelectorAll('[data-field]').forEach(el => {
      const field = el.dataset.field;
      const handler = () => {
        if(field === 'mitigacao' || field === 'planoContingencia'){
          risk[field] = textToBullets(el.value);
        } else if(field === 'nivelRisco' || field === 'impactoRisco'){
          risk[field] = Number(el.value);
          card.querySelector('[data-role="nrval"]').textContent = risk.nivelRisco;
          card.querySelector('[data-role="irval"]').textContent = risk.impactoRisco;
          const s = risk.nivelRisco * risk.impactoRisco;
          const c = heatColor(s);
          card.querySelector('.risk-heat').style.background = c;
          const scoreEl = card.querySelector('.risk-score');
          scoreEl.textContent = s;
          scoreEl.style.background = c + '22';
          scoreEl.style.color = c;
        } else {
          risk[field] = el.value;
        }
        if(field === 'descricao' || field === 'mitigacao' || field === 'planoContingencia' || field === 'tipoRisco' || field === 'perigos'){
          const counter = card.querySelector(`[data-counter="${field}"]`);
          const max = (field === 'tipoRisco' || field === 'perigos') ? 50 : 200;
          if(counter) counter.textContent = `${el.value.length}/${max}`;
        }
        save();
      };
      el.addEventListener('input', handler);
      if(el.tagName === 'SELECT') el.addEventListener('change', handler);
    });

    card.querySelector('[data-action="delete"]').onclick = () => {
      if(!confirm('Remover este risco?')) return;
      client.risks = client.risks.filter(r => r.id !== risk.id);
      save(); renderRiskList(client);
    };

    wrap.appendChild(card);
  });

  const addBtn = document.getElementById('add-risk-btn');
  const notice = document.getElementById('risk-limit-notice');
  const atLimit = client.risks.length >= MAX_RISKS;
  if(addBtn) addBtn.style.display = atLimit ? 'none' : '';
  if(notice) notice.style.display = atLimit ? '' : 'none';
}

const YEARLY_ROWS = [
  { key:'comprasCin', label:'Compras (€)', type:'number' },
  { key:'percCin', label:'% CIN', type:'percent' },
  { key:'comprasConcorrencia', label:'Compras Concorrência (€)', type:'calculated' },
  { key:'marcaConc1', label:'Marca Concorrência 1', type:'select' },
  { key:'marcaConc2', label:'Marca Concorrência 2', type:'select' },
  { key:'marcaConc3', label:'Marca Concorrência 3', type:'select' },
  { key:'marcaConc4', label:'Marca Concorrência 4', type:'select' },
  { key:'lojasQtd', label:'Lojas (qtd)', type:'number' },
  { key:'colaboradoresQtd', label:'Colaboradores', type:'text' }
];

function recalcYearRow(row){
  row.comprasConcorrencia = calcComprasConcorrencia(row.comprasCin, row.percCin);
}

function groupedDisplay(val, row){
  if(val === null || val === undefined || val === '') return '';
  const num = Number(val);
  if(!Number.isFinite(num)) return '';
  if(row.type === 'percent') return Math.round(num * 100).toLocaleString('pt-PT');
  const hasDecimals = row.key === 'comprasCin';
  return num.toLocaleString('pt-PT', hasDecimals ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 0 });
}
function rawDisplay(val, row){
  if(val === null || val === undefined || val === '') return '';
  if(row.type === 'percent') return String(Math.round(Number(val) * 100));
  return String(val);
}
function parseGroupedNumber(str){
  if(str === '') return null;
  // aceita tanto "700000" / "1234.56" (a escrever) como "700.000,00" (formatado, ex.: colado)
  const cleaned = String(str).trim();
  let normalized;
  if(/,\d{1,2}$/.test(cleaned) && cleaned.includes('.')){
    normalized = cleaned.replace(/\./g, '').replace(',', '.');
  } else {
    normalized = cleaned.replace(/\s/g, '').replace(',', '.');
  }
  const n = Number(normalized);
  return Number.isFinite(n) ? n : null;
}

function renderYearlyTable(client){
  const table = document.getElementById('yearly-table');
  const years = [...client.yearlyData].sort((a,b) => (b.ano ?? -Infinity) - (a.ano ?? -Infinity));
  years.forEach(recalcYearRow);

  let head = '<thead><tr><th>Últimos 4 anos</th>' +
    years.map(y => `<th><input type="text" inputmode="numeric" class="year-header-input" placeholder="Ano" value="${y.ano ?? ''}" data-yid="${y.id}"/></th>`).join('') +
    '</tr></thead>';
  let body = '<tbody>';
  YEARLY_ROWS.forEach(row => {
    body += `<tr><td>${row.label}${row.type==='percent' ? ' (%)' : ''}</td>`;
    years.forEach(y => {
      if(row.type === 'calculated'){
        const v = y[row.key];
        const display = v === null || v === undefined ? '—' : fmtMoney(v);
        body += `<td class="calc-cell" data-yid="${y.id}" title="Calculado: Compras − (Compras × %CIN)">${escapeHtml(display)}</td>`;
      } else if(row.type === 'select'){
        const current = y[row.key] || '';
        const opts = ['<option value="">—</option>', ...CONCORRENCIA_BRANDS.map(b => `<option value="${b}" ${current===b?'selected':''}>${b}</option>`)].join('');
        body += `<td><select data-yid="${y.id}" data-field="${row.key}" data-type="select">${opts}</select></td>`;
      } else if(row.type === 'text'){
        const val = y[row.key];
        body += `<td><input type="text" value="${escapeHtml(val || '')}" data-yid="${y.id}" data-field="${row.key}" data-type="${row.type}"/></td>`;
      } else {
        const display = groupedDisplay(y[row.key], row);
        body += `<td><input type="text" inputmode="decimal" class="grouped-number" value="${escapeHtml(display)}" data-yid="${y.id}" data-field="${row.key}" data-type="${row.type}"/></td>`;
      }
    });
    body += '</tr>';
  });
  body += '</tbody>';
  table.innerHTML = head + body;

  table.querySelectorAll('.year-header-input').forEach(el => {
    el.addEventListener('change', () => {
      const row = client.yearlyData.find(y => y.id === el.dataset.yid);
      const v = Number(el.value);
      row.ano = Number.isFinite(v) && v > 0 ? v : row.ano;
      save(); renderYearlyTable(client);
    });
  });

  table.querySelectorAll('.grouped-number').forEach(el => {
    const rowDef = YEARLY_ROWS.find(r => r.key === el.dataset.field);
    el.addEventListener('focus', () => {
      const row = client.yearlyData.find(y => y.id === el.dataset.yid);
      el.value = rawDisplay(row[el.dataset.field], rowDef);
    });
    el.addEventListener('blur', () => {
      const row = client.yearlyData.find(y => y.id === el.dataset.yid);
      el.value = groupedDisplay(row[el.dataset.field], rowDef);
    });
  });

  table.querySelectorAll('[data-field]').forEach(el => {
    const handler = () => {
      const field = el.dataset.field;
      const type = el.dataset.type;
      const row = client.yearlyData.find(y => y.id === el.dataset.yid);
      let v = el.value;
      if(type === 'select'){
        row[field] = v;
      } else if(v === ''){
        row[field] = type === 'text' ? '' : null;
      } else if(type === 'number'){
        row[field] = parseGroupedNumber(v);
      } else if(type === 'percent'){
        const n = parseGroupedNumber(v);
        row[field] = n === null ? null : n / 100;
      } else {
        row[field] = v;
      }
      save();
      if(field === 'comprasCin' || field === 'percCin'){
        recalcYearRow(row);
        const calcCell = table.querySelector(`.calc-cell[data-yid="${row.id}"]`);
        if(calcCell) calcCell.textContent = row.comprasConcorrencia === null ? '—' : fmtMoney(row.comprasConcorrencia);
      }
    };
    el.addEventListener('input', handler);
    if(el.tagName === 'SELECT') el.addEventListener('change', handler);
  });
}

function sanitizeSheetName(name, used){
  let s = String(name || 'Cliente').replace(/[\\\/\?\*\[\]:]/g, ' ').replace(/\s+/g,' ').trim();
  if(!s) s = 'Cliente';
  s = s.slice(0, 31);
  let base = s, i = 2;
  while(used.has(s)){
    const suffix = ` (${i})`;
    s = base.slice(0, 31 - suffix.length) + suffix;
    i++;
  }
  used.add(s);
  return s;
}

const XL = {
  navy:   { argb: 'FF1B2A5E' },
  navySoft: { argb: 'FFE9ECF6' },
  red:    { argb: 'FFD4202A' },
  orange: { argb: 'FFE2711D' },
  warn:   { argb: 'FFC8881A' },
  ok:     { argb: 'FF1F9D6B' },
  white:  { argb: 'FFFFFFFF' },
  ink:    { argb: 'FF1C2230' },
  line:   { argb: 'FFDDE2D8' },
  zebra:  { argb: 'FFF6F8FD' }
};
const thinBorder = { style: 'thin', color: XL.line };
const allBorders = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };

function xlScoreFill(score){
  if(score > 45) return XL.red;
  if(score > 35) return XL.orange;
  if(score > 25) return XL.warn;
  return XL.ok;
}

function xlTitleRow(ws, text, span){
  const row = ws.addRow([text]);
  ws.mergeCells(row.number, 1, row.number, span);
  row.height = 26;
  row.getCell(1).font = { bold: true, size: 14, color: XL.white };
  row.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: XL.navy };
  row.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  for(let c = 1; c <= span; c++){ row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: XL.navy }; }
}

function xlSectionRow(ws, text, span){
  const row = ws.addRow([text]);
  ws.mergeCells(row.number, 1, row.number, span);
  row.height = 20;
  row.getCell(1).font = { bold: true, size: 11, color: XL.navy };
  row.getCell(1).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  for(let c = 1; c <= span; c++){ row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: XL.navySoft }; }
}

function xlHeaderRow(ws, values){
  const row = ws.addRow(values);
  row.height = 20;
  row.eachCell(cell => {
    cell.font = { bold: true, size: 10, color: XL.white };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: XL.navy };
    cell.alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
    cell.border = allBorders;
  });
  return row;
}

function buildClientSheet(wb, client){
  const ws = wb.addWorksheet(sanitizeSheetName(client.nome, wb.__usedNames));
  ws.columns = [
    { width: 24 }, { width: 16 }, { width: 18 }, { width: 42 },
    { width: 11 }, { width: 11 }, { width: 12 },
    { width: 34 }, { width: 34 }, { width: 18 }, { width: 20 }
  ];

  xlTitleRow(ws, `MATRIZ DE RISCO · ${client.nome}`, 11);
  ws.addRow([]);

  const infoLabels = ['Cliente', 'Número', 'Geografia (sede)'];
  const infoValues = [client.nome, client.numero || '—', client.geografia || '—'];
  infoLabels.forEach((label, i) => {
    const row = ws.addRow([label, infoValues[i]]);
    row.getCell(1).font = { bold: true, color: XL.ink };
    row.getCell(2).font = { color: XL.ink };
  });
  ws.addRow([]);

  xlSectionRow(ws, 'MATRIZ DE RISCO', 11);
  xlHeaderRow(ws, ['Risco','Tipo de risco','Perigos imediatos','Descrição','Prob.','IR','Avaliação','Mitigação','Plano de Contingência','Owner','Data limite']);

  const sortedRisks = [...client.risks].sort((a,b) => (b.nivelRisco*b.impactoRisco) - (a.nivelRisco*a.impactoRisco));
  sortedRisks.forEach((r, idx) => {
    const score = (Number(r.nivelRisco)||0) * (Number(r.impactoRisco)||0);
    const row = ws.addRow([
      r.titulo || '', r.tipoRisco || '', r.perigos || '', r.descricao || '',
      r.nivelRisco, r.impactoRisco, score,
      (r.mitigacao || []).join('\n'),
      (r.planoContingencia || []).join('\n'),
      r.owner || '—', formatRiskDate(r.data)
    ]);
    row.eachCell((cell, col) => {
      cell.border = allBorders;
      cell.alignment = { vertical: 'top', wrapText: true };
      if(!(idx % 2)) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: XL.zebra };
    });
    const scoreCell = row.getCell(7);
    scoreCell.fill = { type: 'pattern', pattern: 'solid', fgColor: xlScoreFill(score) };
    scoreCell.font = { bold: true, color: XL.white };
    scoreCell.alignment = { vertical: 'middle', horizontal: 'center' };
    row.getCell(1).font = { bold: true, color: XL.ink };
  });
  if(sortedRisks.length === 0){
    const row = ws.addRow(['Sem riscos registados.']);
    ws.mergeCells(row.number, 1, row.number, 11);
    row.getCell(1).font = { italic: true, color: XL.ink };
  }
  ws.addRow([]);

  xlSectionRow(ws, 'COMPRAS · MARCAS · LOJAS · COLABORADORES', 11);
  const years = [...client.yearlyData].sort((a,b) => (b.ano ?? -Infinity) - (a.ano ?? -Infinity));
  years.forEach(recalcYearRow);
  xlHeaderRow(ws, ['Indicador', ...years.map(y => y.ano ?? '—')]);
  YEARLY_ROWS.forEach((row, idx) => {
    const values = [row.label + (row.type === 'percent' ? ' (%)' : '')];
    years.forEach(y => {
      const v = y[row.key];
      if(v === null || v === undefined || v === ''){ values.push(''); }
      else if(row.type === 'percent'){ values.push(Math.round(v*100)); }
      else if(row.type === 'calculated'){ values.push(v === null ? '' : Math.round(v * 100) / 100); }
      else { values.push(v); }
    });
    const xlRow = ws.addRow(values);
    xlRow.eachCell(cell => {
      cell.border = allBorders;
      if(!(idx % 2)) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: XL.zebra };
    });
    xlRow.getCell(1).font = { bold: true, color: XL.ink };
  });
  ws.addRow([]);

  xlSectionRow(ws, 'OBSERVAÇÕES', 11);
  const obsRow = ws.addRow([client.observacoes || '—']);
  ws.mergeCells(obsRow.number, 1, obsRow.number, 11);
  obsRow.height = 40;
  obsRow.getCell(1).alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
  obsRow.getCell(1).border = allBorders;

  ws.views = [{ state: 'frozen', ySplit: 8 }];
}

// ============================================================
// IMPORTAÇÃO DE EXCEL (pré-preenchimento)
// ============================================================

function cellText(cell){
  if(!cell) return '';
  let v = cell.value;
  if(v === null || v === undefined) return '';
  if(typeof v === 'object'){
    if(Array.isArray(v.richText)) return v.richText.map(t => t.text).join('');
    if(v.result !== undefined) return String(v.result);
    if(v.text !== undefined) return String(v.text);
    if(v instanceof Date) return '';
    return '';
  }
  return String(v).trim();
}
function cellNum(cell){
  const t = cellText(cell);
  if(t === '') return null;
  const n = Number(String(t).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}
function normText(s){ return String(s || '').toLowerCase().trim(); }

function matchBrands(text, max){
  if(!text) return [];
  const tokens = String(text).split(/[\/,;]+/).map(t => t.trim()).filter(Boolean);
  const found = [];
  tokens.forEach(tok => {
    const low = tok.toLowerCase();
    const brand = CONCORRENCIA_BRANDS.find(b => low.includes(b.toLowerCase()));
    if(brand && !found.includes(brand)) found.push(brand);
  });
  return found.slice(0, max || 4);
}

function isOwnFormatSheet(ws){
  return normText(cellText(ws.getRow(1).getCell(1))).includes('matriz de risco');
}

function findRowIndex(ws, predicate, maxRow){
  const limit = Math.min(maxRow || 60, ws.rowCount || 60);
  for(let r = 1; r <= limit; r++){
    const row = ws.getRow(r);
    if(predicate(row, r)) return r;
  }
  return -1;
}

// --- Formato próprio (round-trip do que esta ferramenta exporta) -----------

function parseOwnFormatSheet(ws){
  let nome = '', numero = '', geografia = '', observacoes = '';

  const maxScan = Math.min(ws.rowCount || 20, 20);
  for(let r = 1; r <= maxScan; r++){
    const row = ws.getRow(r);
    const label = normText(cellText(row.getCell(1)));
    if(label === 'cliente') nome = cellText(row.getCell(2));
    else if(label === 'número' || label === 'numero') numero = cellText(row.getCell(2));
    else if(label.includes('geografia')) geografia = cellText(row.getCell(2));
  }

  // --- Riscos ---
  const riskHeaderRow = findRowIndex(ws, row => {
    const c1 = normText(cellText(row.getCell(1)));
    if(c1 !== 'risco') return false;
    for(let c = 2; c <= 11; c++){ if(normText(cellText(row.getCell(c))).includes('descri')) return true; }
    return false;
  });

  const risks = [];
  if(riskHeaderRow > -1){
    const header = ws.getRow(riskHeaderRow);
    const colMap = {};
    for(let c = 1; c <= 11; c++){
      const t = normText(cellText(header.getCell(c)));
      if(t === 'risco') colMap.titulo = c;
      else if(t.includes('tipo')) colMap.tipoRisco = c;
      else if(t.includes('perigo')) colMap.perigos = c;
      else if(t.includes('descri')) colMap.descricao = c;
      else if(t.includes('prob')) colMap.nivelRisco = c;
      else if(t === 'ir') colMap.impactoRisco = c;
      else if(t.includes('mitiga')) colMap.mitigacao = c;
      else if(t.includes('conting')) colMap.planoContingencia = c;
      else if(t.includes('owner')) colMap.owner = c;
      else if(t.includes('data')) colMap.data = c;
    }
    for(let r = riskHeaderRow + 1; r <= riskHeaderRow + 12 && risks.length < MAX_RISKS; r++){
      const row = ws.getRow(r);
      const titulo = cellText(row.getCell(colMap.titulo || 1));
      if(!titulo) break;
      if(normText(titulo) === 'sem riscos registados.') break;
      const dataRaw = cellText(row.getCell(colMap.data));
      const dataMatch = dataRaw.match(/(\d{4})/);
      risks.push({
        id: uid(),
        titulo,
        tipoRisco: cellText(row.getCell(colMap.tipoRisco)),
        perigos: cellText(row.getCell(colMap.perigos)),
        descricao: cellText(row.getCell(colMap.descricao)),
        nivelRisco: cellNum(row.getCell(colMap.nivelRisco)) || 1,
        impactoRisco: cellNum(row.getCell(colMap.impactoRisco)) || 1,
        mitigacao: textToBullets(cellText(row.getCell(colMap.mitigacao))),
        planoContingencia: textToBullets(cellText(row.getCell(colMap.planoContingencia))),
        owner: cellText(row.getCell(colMap.owner)),
        data: dataMatch ? dataMatch[1] : ''
      });
    }
  }

  // --- Dados anuais ---
  const yearlyHeaderRow = findRowIndex(ws, row => normText(cellText(row.getCell(1))) === 'indicador');
  const yearlyData = [];
  if(yearlyHeaderRow > -1){
    const header = ws.getRow(yearlyHeaderRow);
    const yearCols = [];
    for(let c = 2; c <= 6; c++){
      const t = cellText(header.getCell(c));
      const y = Number(t);
      if(t !== '' && Number.isFinite(y)) yearCols.push({ col: c, ano: y });
      else if(t !== '') yearCols.push({ col: c, ano: null });
    }
    yearCols.forEach(yc => {
      yearlyData.push({
        id: uid(), ano: yc.ano,
        comprasCin: cellNum(ws.getRow(yearlyHeaderRow + 1).getCell(yc.col)),
        percCin: (() => { const v = cellNum(ws.getRow(yearlyHeaderRow + 2).getCell(yc.col)); return v === null ? null : v / 100; })(),
        comprasConcorrencia: null,
        marcaConc1: cellText(ws.getRow(yearlyHeaderRow + 4).getCell(yc.col)),
        marcaConc2: cellText(ws.getRow(yearlyHeaderRow + 5).getCell(yc.col)),
        marcaConc3: cellText(ws.getRow(yearlyHeaderRow + 6).getCell(yc.col)),
        marcaConc4: cellText(ws.getRow(yearlyHeaderRow + 7).getCell(yc.col)),
        lojasQtd: cellNum(ws.getRow(yearlyHeaderRow + 8).getCell(yc.col)),
        colaboradoresQtd: cellText(ws.getRow(yearlyHeaderRow + 9).getCell(yc.col))
      });
    });
  }
  while(yearlyData.length < 4){
    const offset = yearlyData.length + 1;
    yearlyData.push({ id: uid(), ano: new Date().getFullYear() - offset, comprasCin: null, percCin: null, comprasConcorrencia: null, marcaConc1: '', marcaConc2: '', marcaConc3: '', marcaConc4: '', lojasQtd: null, colaboradoresQtd: '' });
  }

  // --- Observações ---
  const obsHeaderRow = findRowIndex(ws, row => normText(cellText(row.getCell(1))) === 'observações' || normText(cellText(row.getCell(1))) === 'observacoes');
  if(obsHeaderRow > -1) observacoes = cellText(ws.getRow(obsHeaderRow + 1).getCell(1));

  if(!nome) return null;
  return { nome, numero, geografia, observacoes, risks, yearlyData };
}

// --- Formato original (template CIN, uma folha por cliente) ----------------

function parseOriginalFormatSheet(ws){
  let nome = cellText(ws.getRow(3).getCell(2));
  let numero = '', geografia = '';

  const maxScan = Math.min(ws.rowCount || 6, 6);
  for(let r = 1; r <= maxScan; r++){
    const row = ws.getRow(r);
    for(let c = 1; c <= 10; c++){
      const t = normText(cellText(row.getCell(c)));
      if(t.length > 30) continue; // ignora frases longas (ex.: texto de riscos), só interessam rótulos curtos
      if(t.includes('número') || t.includes('numero')) numero = cellText(row.getCell(c + 1));
      else if(t.startsWith('geograf') || t.startsWith('geogrf')) geografia = cellText(row.getCell(c + 1));
    }
  }
  if(!nome) nome = ws.name;

  // --- Riscos ---
  const riskHeaderRow = findRowIndex(ws, row => {
    let hasRisco = false, hasDescricao = false;
    for(let c = 1; c <= 14; c++){
      const t = normText(cellText(row.getCell(c)));
      if(t === 'risco') hasRisco = true;
      if(t.includes('descri')) hasDescricao = true;
    }
    return hasRisco && hasDescricao;
  });

  const risks = [];
  if(riskHeaderRow > -1){
    const header = ws.getRow(riskHeaderRow);
    const colMap = {};
    for(let c = 1; c <= 14; c++){
      const t = normText(cellText(header.getCell(c)));
      if(t === 'risco') colMap.titulo = c;
      else if(t.includes('tipo')) colMap.tipoRisco = c;
      else if(t.includes('perigo')) colMap.perigos = c;
      else if(t.includes('descri')) colMap.descricao = c;
      else if(t.includes('nível') || t.includes('nivel') || t.includes('probabilidade')) colMap.nivelRisco = c;
      else if(t.includes('impacto')) colMap.impactoRisco = c;
      else if(t.includes('mitiga')) colMap.mitigacao = c;
      else if(t.includes('conting')) colMap.planoContingencia = c;
      else if(t.includes('owner')) colMap.owner = c;
      else if(t === 'data') colMap.data = c;
    }
    let lastSignature = '';
    for(let r = riskHeaderRow + 1; r <= riskHeaderRow + 16 && risks.length < MAX_RISKS; r++){
      const row = ws.getRow(r);
      const nr = cellNum(row.getCell(colMap.nivelRisco));
      const ir = cellNum(row.getCell(colMap.impactoRisco));
      if(nr === null || ir === null) continue;
      const descricao = cellText(row.getCell(colMap.descricao));
      const signature = descricao + '|' + nr + '|' + ir;
      if(signature === lastSignature) continue; // linha "eco" de uma célula fundida verticalmente
      lastSignature = signature;
      let titulo = cellText(row.getCell(colMap.titulo));
      if(!titulo || /^risco\s*\(qual/i.test(titulo)) titulo = cellText(row.getCell(colMap.tipoRisco)) || 'Risco';
      risks.push({
        id: uid(),
        titulo,
        tipoRisco: cellText(row.getCell(colMap.tipoRisco)),
        perigos: cellText(row.getCell(colMap.perigos)),
        descricao,
        nivelRisco: nr, impactoRisco: ir,
        mitigacao: textToBullets(cellText(row.getCell(colMap.mitigacao))),
        planoContingencia: textToBullets(cellText(row.getCell(colMap.planoContingencia))),
        owner: cellText(row.getCell(colMap.owner)),
        data: cellText(row.getCell(colMap.data))
      });
    }
  }

  // --- Dados anuais ---
  const comprasHeaderRow = findRowIndex(ws, row => {
    for(let c = 1; c <= 12; c++){ if(normText(cellText(row.getCell(c))) === 'compras') return true; }
    return false;
  });

  const yearlyData = [];
  if(comprasHeaderRow > -1){
    for(let r = comprasHeaderRow + 1; r <= comprasHeaderRow + 8 && yearlyData.length < 4; r++){
      const row = ws.getRow(r);
      let yearCol = -1, ano = null;
      for(let c = 1; c <= 6; c++){
        const n = cellNum(row.getCell(c));
        if(n !== null && n >= 1990 && n <= 2100){ yearCol = c; ano = n; break; }
      }
      if(yearCol === -1) continue;
      const comprasTotal = cellNum(row.getCell(yearCol + 1));
      const marcasText = cellText(row.getCell(yearCol + 2));
      const percCin = cellNum(row.getCell(yearCol + 4));
      const lojasQtd = cellNum(row.getCell(yearCol + 5));
      const colaboradoresQtd = cellText(row.getCell(yearCol + 7));
      const brands = matchBrands(marcasText, 4);
      yearlyData.push({
        id: uid(), ano,
        comprasCin: comprasTotal,
        percCin,
        comprasConcorrencia: null,
        marcaConc1: brands[0] || '', marcaConc2: brands[1] || '', marcaConc3: brands[2] || '', marcaConc4: brands[3] || '',
        lojasQtd, colaboradoresQtd
      });
    }
  }
  while(yearlyData.length < 4){
    const offset = yearlyData.length + 1;
    yearlyData.push({ id: uid(), ano: new Date().getFullYear() - offset, comprasCin: null, percCin: null, comprasConcorrencia: null, marcaConc1: '', marcaConc2: '', marcaConc3: '', marcaConc4: '', lojasQtd: null, colaboradoresQtd: '' });
  }

  // --- Observações ---
  let observacoes = '';
  const obsRow = findRowIndex(ws, row => {
    for(let c = 1; c <= 12; c++){ if(normText(cellText(row.getCell(c))).includes('observa')) return true; }
    return false;
  });
  if(obsRow > -1){
    const row = ws.getRow(obsRow);
    for(let c = 1; c <= 12; c++){
      if(normText(cellText(row.getCell(c))).includes('observa')){
        for(let c2 = c + 1; c2 <= 14; c2++){
          const t = cellText(row.getCell(c2));
          if(t){ observacoes = t; break; }
        }
        break;
      }
    }
    if(!observacoes) observacoes = cellText(ws.getRow(obsRow + 1).getCell(1));
  }

  if(!nome) return null;
  return { nome, numero, geografia, observacoes, risks, yearlyData };
}

async function handleExcelImport(file){
  if(typeof ExcelJS === 'undefined'){
    alert('Não foi possível carregar a biblioteca de Excel (é preciso ligação à internet na primeira vez). Tenta novamente.');
    return;
  }
  try {
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);

    let imported = 0, skipped = 0;
    wb.worksheets.forEach(ws => {
      if(normText(ws.name).includes('exemplo')) return;
      let parsed = null;
      try {
        parsed = isOwnFormatSheet(ws) ? parseOwnFormatSheet(ws) : parseOriginalFormatSheet(ws);
      } catch(e){ console.error('Erro ao importar a folha', ws.name, e); }
      if(parsed && parsed.nome){
        state.clients.push({ id: uid(), ...parsed });
        imported++;
      } else {
        skipped++;
      }
    });

    if(imported > 0){
      save();
      activeId = state.clients[state.clients.length - imported].id;
      renderAll();
    }
    alert(`Importação concluída: ${imported} cliente(s) importado(s).${skipped ? ` ${skipped} folha(s) não reconhecida(s) foram ignoradas.` : ''}\n\nRevê sempre os dados importados — a leitura automática pode não ser perfeita.`);
  } catch(e){
    alert('Não foi possível importar este ficheiro: ' + e.message);
  }
}

document.getElementById('import-excel-btn').onclick = () => document.getElementById('import-excel-input').click();
document.getElementById('import-excel-input').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  handleExcelImport(file);
  e.target.value = '';
};

async function exportExcel(){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'CIN · Gestão Comercial';
  wb.created = new Date();
  wb.__usedNames = new Set();

  state.clients.forEach(client => buildClientSheet(wb, client));

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const today = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `matriz-risco-clientes-${today}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function buildPrintSheet(client){
  const years = [...client.yearlyData].sort((a,b) => (b.ano ?? -Infinity) - (a.ano ?? -Infinity));
  years.forEach(recalcYearRow);
  const sortedRisks = [...client.risks].sort((a,b) => (b.nivelRisco*b.impactoRisco) - (a.nivelRisco*a.impactoRisco));

  let risksHtml = `<table class="ps-table"><thead><tr>
    <th style="width:10%">Risco</th><th style="width:8%">Tipo</th><th style="width:8%">Perigos</th>
    <th style="width:12%">Descrição</th><th style="width:5%">Prob.</th><th style="width:5%">IR</th><th style="width:6%">Avaliação</th>
    <th style="width:15%">Mitigação</th><th style="width:15%">Contingência</th><th style="width:8%">Owner</th><th style="width:8%">Data</th>
  </tr></thead><tbody>`;

  sortedRisks.forEach(r => {
    const score = (Number(r.nivelRisco)||0) * (Number(r.impactoRisco)||0);
    const dateDisplay = formatRiskDate(r.data);
    const color = heatColor(score);
    risksHtml += `<tr>
      <td>${escapeHtml(r.titulo)}</td>
      <td>${escapeHtml(r.tipoRisco)}</td>
      <td>${escapeHtml(r.perigos)}</td>
      <td>${escapeHtml(r.descricao)}</td>
      <td class="ps-score">${r.nivelRisco}</td>
      <td class="ps-score">${r.impactoRisco}</td>
      <td class="ps-score" style="background:${color};color:#fff">${score}</td>
      <td>${(r.mitigacao||[]).map(escapeHtml).join('<br>')}</td>
      <td>${(r.planoContingencia||[]).map(escapeHtml).join('<br>')}</td>
      <td>${escapeHtml(r.owner) || '—'}</td>
      <td>${escapeHtml(dateDisplay)}</td>
    </tr>`;
  });
  risksHtml += '</tbody></table>';

  let yearlyHtml = '<table class="ps-table"><thead><tr><th style="width:22%">Indicador</th>' + years.map(y => `<th>${y.ano ?? '—'}</th>`).join('') + '</tr></thead><tbody>';
  YEARLY_ROWS.forEach(row => {
    yearlyHtml += `<tr><td>${row.label}${row.type==='percent'?' (%)':''}</td>`;
    years.forEach(y => {
      let v = y[row.key];
      let display = '—';
      if(v !== null && v !== undefined && v !== ''){
        if(row.type === 'percent') display = fmtPercent(v);
        else if(row.key === 'comprasCin' || row.type === 'calculated') display = fmtMoney(v);
        else display = v;
      }
      yearlyHtml += `<td>${escapeHtml(display)}</td>`;
    });
    yearlyHtml += '</tr>';
  });
  yearlyHtml += '</tbody></table>';

  const today = new Date().toLocaleDateString('pt-PT');

  document.getElementById('print-sheet').innerHTML = `
    <div class="ps-header">
      <div>
        <div class="ps-logo"><img class="ps-logo-img" src="${CIN_LOGO}" alt="CIN"/><span class="ps-brand">Gestão Comercial</span></div>
        <div class="ps-title">${escapeHtml(client.nome)}</div>
      </div>
      <div class="ps-meta">
        Cliente nº ${escapeHtml(client.numero||'—')}<br>
        ${escapeHtml(client.geografia||'—')}<br>
        Gerado em ${today}
      </div>
    </div>

    <div class="ps-section">Matriz de risco</div>
    ${risksHtml}

    <div class="ps-section">Compras · Marcas · Lojas · Colaboradores (últimos 4 anos)</div>
    ${yearlyHtml}

    <div class="ps-section">Observações</div>
    <div class="ps-obs">${escapeHtml(client.observacoes) || '—'}</div>

    <div class="ps-footer">Matriz de Risco de Cliente · CIN</div>
  `;
}

document.getElementById('topbar-logo').src = CIN_LOGO;

renderAll();
