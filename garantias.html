<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIN · Gestão de Reparações e Garantias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2a5e;
    --navy-soft:#2f3f78;
    --red:#d4202a;
    --ink:#1c2230;
    --muted:#5a6480;
    --line:rgba(27,42,94,.14);
    --glass:rgba(255,255,255,.55);
    --glass-strong:rgba(255,255,255,.78);
    --ok:#1f9d6b;
    --warn:#c8881a;
    --info:#2f6fd4;
    --done:#6b7280;
    --radius:18px;
    --shadow:0 10px 40px rgba(27,42,94,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Poppins",system-ui,Arial,sans-serif;
    color:var(--ink);
    min-height:100%;
    background:
      radial-gradient(1100px 700px at 12% -5%, #dfe7ff 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 0%, #ffe2e4 0%, transparent 50%),
      radial-gradient(800px 800px at 50% 120%, #e4ecff 0%, transparent 55%),
      linear-gradient(135deg,#eef2fb 0%,#f6f8fd 100%);
    background-attachment:fixed;
  }

  /* ---------- App shell ---------- */
  .app{max-width:1180px;margin:0 auto;padding:22px 22px 60px;}
  .topbar{
    display:flex;align-items:center;gap:16px;
    background:var(--glass-strong);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 20px;
    box-shadow:var(--shadow);
    position:sticky;top:14px;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-img{height:34px;width:auto;display:block;border-radius:4px;}
  .brand .t{font-size:13px;font-weight:700;color:var(--navy);line-height:1.2;}
  .brand .t small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.3px;}
  .spacer{flex:1;}
  .store-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;}
  select,.btn,input,textarea{font-family:inherit;}
  select{
    border:1px solid var(--line);background:rgba(255,255,255,.7);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);
    outline:none;cursor:pointer;
  }
  .btn{
    border:none;border-radius:11px;padding:10px 18px;font-size:13px;font-weight:700;
    cursor:pointer;transition:.15s;letter-spacing:.2px;
  }
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(212,32,42,.28);}
  .btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .btn-ghost{background:rgba(27,42,94,.06);color:var(--navy);}
  .btn-ghost:hover{background:rgba(27,42,94,.12);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0;}
  .kpi{
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);
  }
  .kpi .n{font-size:30px;font-weight:800;color:var(--navy);line-height:1;}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px;}
  .kpi .bar{height:4px;border-radius:4px;margin-top:12px;background:rgba(27,42,94,.1);overflow:hidden;}
  .kpi .bar i{display:block;height:100%;border-radius:4px;}

  /* ---------- Layout ---------- */
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
  .card{
    background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  }
  .card-head h2{margin:0;font-size:15px;font-weight:800;color:var(--navy);}
  .card-head .spacer{flex:1;}
  .search{
    border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:10px;
    padding:8px 12px;font-size:13px;width:200px;outline:none;
  }
  .card-body{padding:8px 10px;}

  /* ---------- Lista ---------- */
  .rep{
    display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    padding:13px 14px;border-radius:14px;cursor:pointer;transition:.12s;
  }
  .rep:hover{background:rgba(27,42,94,.05);}
  .rep.active{background:rgba(212,32,42,.07);box-shadow:inset 0 0 0 1px rgba(212,32,42,.25);}
  .rep .reg{font-size:12px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
  .rep .who{font-size:14px;font-weight:700;}
  .rep .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .pill{
    font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;letter-spacing:.2px;
  }
  .p-rec{background:rgba(47,111,212,.12);color:var(--info);}
  .p-rep{background:rgba(200,136,26,.15);color:var(--warn);}
  .p-pronta{background:rgba(31,157,107,.14);color:var(--ok);}
  .p-entregue{background:rgba(107,114,128,.14);color:var(--done);}
  .maker-tag{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;
    background:rgba(27,42,94,.08);color:var(--navy);padding:2px 7px;border-radius:5px;margin-right:6px;
  }
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;}

  /* ---------- Detalhe ---------- */
  #detail .card-body{padding:18px 20px;}
  .d-reg{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;}
  .d-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .d-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .d-row .k{color:var(--muted);font-weight:600;}
  .d-row .v{font-weight:700;text-align:right;}
  .d-block{margin-top:14px;}
  .d-block .lbl{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.4px;margin-bottom:5px;}
  .d-block .txt{font-size:13px;line-height:1.5;color:var(--ink);background:rgba(27,42,94,.04);border-radius:10px;padding:10px 12px;}
  .state-row{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap;}
  .state-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.6);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
  }
  .state-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .d-actions{display:flex;gap:10px;margin-top:18px;}

  /* ---------- Modal nova reparação ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(27,42,94,.32);backdrop-filter:blur(4px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%;max-width:620px;background:var(--glass-strong);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,.6);border-radius:22px;box-shadow:0 30px 80px rgba(27,42,94,.3);
    overflow:hidden;
  }
  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0;font-size:16px;color:var(--navy);}
  .modal-head .x{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
  .modal-body{padding:20px 22px;max-height:62vh;overflow:auto;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.3px;margin-bottom:5px;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);background:rgba(255,255,255,.75);
    border-radius:10px;padding:10px 12px;font-size:13px;outline:none;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .makers-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .makers-grid label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0;}
  .makers-grid input{width:auto;}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);}

  /* ---------- Folha imprimível ---------- */
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;inset:0;background:#fff;}
    @page{size:A4;margin:0;}
  }
  .sheet{width:210mm;padding:16mm;font-size:12px;color:#000;}
  .sheet .s-logo-img{height:46px;width:auto;display:block;margin-bottom:4px;}
  .sheet .s-sub{font-size:9px;color:var(--navy);font-weight:700;margin:4px 0 14px;}
  .sheet table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .sheet td{border:1px solid #333;padding:6px 8px;height:26px;}
  .sheet .tl{font-weight:700;width:130px;font-size:11px;}
  .sheet .title{border:1px solid #333;text-align:center;font-weight:800;padding:7px;}
  .sheet .mk{border:1px solid #333;border-top:none;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11px;font-weight:700;}
  .sheet .mk span b{display:inline-block;width:13px;height:13px;border:1px solid #333;text-align:center;line-height:12px;margin-right:5px;font-size:11px;}
  .sheet .mdl{border:1px solid #333;border-top:none;padding:12px;font-size:11px;font-weight:700;}
  .sheet .mdl div{margin-bottom:8px;}
  .sheet .mdl u{font-weight:400;}
  .sheet .ar{border:1px solid #333;border-top:none;padding:10px 12px;min-height:90px;}
  .sheet .ar b{font-size:11px;}
  .sheet .ft{display:flex;border:1px solid #333;border-top:none;}
  .sheet .ft div{flex:1;padding:10px 12px;min-height:55px;font-size:11px;font-weight:700;}
  .sheet .ft div:first-child{border-right:1px solid #333;}

  @media(max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .grid{grid-template-columns:1fr;}
    .topbar{flex-wrap:wrap;}
  }
</style>
</head>

<script>
const MAKERS = ["WAGNER","NEOPARTS-KARCHER","GRACO","MAQ. CORTE EPS","DEWALT","BLACK&DECKER","MIRKA","WERKU"];
const STATES = ["Rececionada","Em reparação","Pronta","Entregue"];
const PILL = {"Rececionada":"p-rec","Em reparação":"p-rep","Pronta":"p-pronta","Entregue":"p-entregue"};

let DB = null, reps = [], selectedId = null;

/* ---- IndexedDB ---- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("cin_garantias",1);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("reps"))db.createObjectStore("reps",{keyPath:"id"});};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e);
  });
}
function tx(mode){return DB.transaction("reps",mode).objectStore("reps");}
function loadAll(){return new Promise(res=>{const out=[];tx("readonly").openCursor().onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};});}
function put(r){return new Promise(res=>{tx("readwrite").put(r).onsuccess=res;});}

function nextReg(){
  const year=new Date().getFullYear();
  const n=reps.filter(r=>r.reg.startsWith(year)).length+1;
  return year+"-"+String(n).padStart(4,"0");
}

/* ---- Seed para demo ---- */
async function seed(){
  if(reps.length) return;
  const demo=[
    {nome:"Joaquim Pereira",cliNum:"4412",loja:"Guimarães",comercial:"A. Faria",data:"12/06/2026",fatura:"FT 2026/3391",makers:["WAGNER"],modelo:"Control Pro 350M",serie:"WG350-88421",avaria:"Não faz pressão, motor arranca mas a pistola não pulveriza.",comp:"Equipamento + mangueira + pistola",estado:"Em reparação"},
    {nome:"Sónia Marques",cliNum:"7781",loja:"Braga",comercial:"R. Costa",data:"15/06/2026",fatura:"VD 11204",makers:["NEOPARTS-KARCHER"],modelo:"K5 Premium",serie:"KR5-22019",avaria:"Perde água pela ligação da mangueira de alta pressão.",comp:"Máquina completa",estado:"Pronta"},
    {nome:"Construções Vale Lda",cliNum:"3320",loja:"Porto",comercial:"M. Lopes",data:"18/06/2026",fatura:"FT 2026/3450",makers:["DEWALT"],modelo:"DCD996 Berbequim",serie:"DW996-50112",avaria:"Bateria não carrega e mandril com folga.",comp:"Berbequim + 1 bateria + carregador",estado:"Rececionada"},

  ];
  for(const d of demo){d.id=crypto.randomUUID();d.reg=nextReg();reps.push(d);await put(d);}

/* ---- Render ---- */
function filtered(){
  const q=(document.getElementById("search").value||"").toLowerCase();
  const store=document.getElementById("storeFilter").value;
  return reps.filter(r=>{
    if(store&&r.loja!==store)return false;
    if(!q)return true;
    return (r.nome+r.modelo+r.reg+r.serie).toLowerCase().includes(q);
  }).sort((a,b)=>b.reg.localeCompare(a.reg));
}

function renderKpis(){
  const inRepair=reps.filter(r=>r.estado==="Em reparação").length;
  const ready=reps.filter(r=>r.estado==="Pronta").length;
  const total=reps.length;
  const done=reps.filter(r=>r.estado==="Entregue").length;
  const k=[
    {n:total,l:"Total de reparações",c:"var(--navy)",p:100},
    {n:inRepair,l:"Em reparação",c:"var(--warn)",p:total?inRepair/total*100:0},
    {n:ready,l:"Prontas a entregar",c:"var(--ok)",p:total?ready/total*100:0},
    {n:done,l:"Entregues",c:"var(--done)",p:total?done/total*100:0},
  ];
  document.getElementById("kpis").innerHTML=k.map(x=>`
    <div class="kpi"><div class="n">${x.n}</div><div class="l">${x.l}</div>
    <div class="bar"><i style="width:${x.p}%;background:${x.c}"></i></div></div>`).join("");
}

function renderList(){
  const data=filtered();
  const body=document.getElementById("listBody");
  if(!data.length){body.innerHTML='<div class="empty">Sem reparações para este filtro.</div>';return;}
  body.innerHTML=data.map(r=>`
    <div class="rep ${r.id===selectedId?'active':''}" onclick="select('${r.id}')">
      <div class="reg">${r.reg}</div>
      <div>
        <div class="who">${r.nome}</div>
        <div class="sub"><span class="maker-tag">${r.makers[0]||"—"}</span>${r.modelo} · ${r.loja}</div>
      </div>
      <div class="pill ${PILL[r.estado]}">${r.estado}</div>
    </div>`).join("");
}

function renderDetail(){
  const body=document.getElementById("detailBody");
  const r=reps.find(x=>x.id===selectedId);
  if(!r){body.innerHTML='<div class="empty">Seleciona uma reparação à esquerda<br>ou cria uma nova.</div>';return;}
  body.innerHTML=`
    <div class="d-reg">${r.reg}</div>
    <div class="d-meta">${r.loja} · ${r.data||"sem data"} · ${r.comercial||"—"}</div>
    <div class="state-row">
      ${STATES.map(s=>`<button class="state-btn ${s===r.estado?'on':''}" onclick="setState('${r.id}','${s}')">${s}</button>`).join("")}
    </div>
    <div class="d-row"><span class="k">Cliente</span><span class="v">${r.nome} (nº ${r.cliNum||"—"})</span></div>
    <div class="d-row"><span class="k">Fabricante</span><span class="v">${r.makers.join(", ")||"—"}</span></div>
    <div class="d-row"><span class="k">Modelo</span><span class="v">${r.modelo||"—"}</span></div>
    <div class="d-row"><span class="k">Nº série</span><span class="v">${r.serie||"—"}</span></div>
    <div class="d-row"><span class="k">Factura / VD</span><span class="v">${r.fatura||"—"}</span></div>
    <div class="d-block"><div class="lbl">DESCRIÇÃO DA AVARIA</div><div class="txt">${r.avaria||"—"}</div></div>
    <div class="d-block"><div class="lbl">COMPONENTES ENTREGUES</div><div class="txt">${r.comp||"—"}</div></div>
    <div class="d-actions">
      <button class="btn btn-primary btn-sm" onclick="printSheet('${r.id}')">Imprimir folha CIN</button>
    </div>`;
}

function render(){renderKpis();renderList();renderDetail();}

function select(id){selectedId=id;render();}
async function setState(id,s){const r=reps.find(x=>x.id===id);r.estado=s;await put(r);render();}

/* ---- Modal ---- */
function openModal(){
  document.getElementById("f_makers").innerHTML=MAKERS.map((m,i)=>
    `<label><input type="checkbox" value="${m}" id="mk${i}"> ${m}</label>`).join("");
  ["f_cliNum","f_nome","f_comercial","f_data","f_fatura","f_modelo","f_serie","f_avaria","f_comp"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("overlay").classList.add("show");
}
function closeModal(){document.getElementById("overlay").classList.remove("show");}
async function saveRep(){
  const nome=document.getElementById("f_nome").value.trim();
  if(!nome){alert("Indica o nome do cliente.");return;}
  const makers=MAKERS.filter((m,i)=>document.getElementById("mk"+i).checked);
  const r={
    id:crypto.randomUUID(),reg:nextReg(),estado:"Rececionada",
    cliNum:document.getElementById("f_cliNum").value.trim(),
    nome,loja:document.getElementById("f_loja").value,
    comercial:document.getElementById("f_comercial").value.trim(),
    data:document.getElementById("f_data").value.trim(),
    fatura:document.getElementById("f_fatura").value.trim(),
    makers,modelo:document.getElementById("f_modelo").value.trim(),
    serie:document.getElementById("f_serie").value.trim(),
    avaria:document.getElementById("f_avaria").value.trim(),
    comp:document.getElementById("f_comp").value.trim(),
  };
  reps.push(r);await put(r);selectedId=r.id;closeModal();render();
}
